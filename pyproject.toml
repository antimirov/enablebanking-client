[project]
name = "enablebanking-client"
version = "0.1.0"
description = "A lightweight CLI client to authenticate with European banks and fetch transactions and balances via Enable Banking PSD2 API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "PyJWT>=2.6.0",
    "cryptography>=39.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

